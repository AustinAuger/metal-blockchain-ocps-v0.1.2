name: DAO Nutrition Label - Validate, Generate & Attest

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'profiles/**'
      - 'ocps_ipfs/**'

jobs:
  process-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install system dependencies for canvas
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev

      - name: Install Node dependencies
        run: npm install js-yaml sharp canvas @actions/core

      - name: Validate & Generate Label
        id: generate
        run: node .github/scripts/process-profile.js

      - name: Pin to IPFS via Pinata
        id: pinata
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: |
          CID=$(curl -X POST "https://api.pinata.cloud/pinning/pinFileToIPFS" \
            -H "Authorization: Bearer $PINATA_JWT" \
            -F "file=@generated-label.png" | jq -r '.IpfsHash')
          echo "IPFS_CID=$CID" >> $GITHUB_ENV

      - name: Generate XPR Attestation Payload
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > attestation-payload.json << EOF
          {
            "schema": "dao-nutrition-label-v1",
            "profile_cid": "${{ env.IPFS_CID }}",
            "timestamp": "$TIMESTAMP",
            "submitter": "${{ github.actor }}",
            "pr_number": "${{ github.event.pull_request.number }}"
          }
          EOF
          echo "ATTESTATION_PAYLOAD<<EOF" >> $GITHUB_ENV
          cat attestation-payload.json >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Post results to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const payload = fs.readFileSync('attestation-payload.json', 'utf8');
            const cid = process.env.IPFS_CID;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🎉 DAO Nutrition Label Processed!\n\n**IPFS CID:** \`${cid}\`\n**Live Label:** https://ipfs.io/ipfs/${cid}\n\n**XPR Attestation Payload:**\n\`\`\`json\n${payload}\n\`\`\``
            });
